<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0b0d10">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="音声解説">
<title>音声解説</title>
<style>
:root{--bg:#0b0d10;--line:#23272e;--text:#f2f3f5;--sub:#8b919a;--accent:#3b8cff}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg)}
body{color:var(--text);font-family:-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;padding-bottom:calc(96px + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:inherit}
header{padding:calc(28px + env(safe-area-inset-top)) 22px 6px}
.eyebrow{font-size:11px;letter-spacing:.32em;color:var(--accent);font-weight:700}
h1{font-size:30px;font-weight:900;letter-spacing:.02em;margin-top:8px;line-height:1.25}
.lead{font-size:12px;color:var(--sub);margin-top:8px;letter-spacing:.04em}
.sw{display:flex;margin:18px 16px 2px;border:1px solid var(--line);border-radius:999px;padding:3px}
.sw button{flex:1;text-align:center;font-size:13px;padding:9px 0;border-radius:999px;color:var(--sub);position:relative}
.sw button.on{background:var(--accent);color:#0b0d10;font-weight:900}
.sw i{position:absolute;top:5px;right:12px;width:7px;height:7px;border-radius:50%;background:#ff5a5a}
.count{display:flex;gap:22px;margin:16px 22px 0;padding:14px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.count div{font-size:10px;color:var(--sub);letter-spacing:.18em}
.count b{display:block;font-size:22px;color:var(--text);letter-spacing:0;font-weight:700;margin-top:2px}
.all{display:block;width:calc(100% - 44px);margin:16px 22px 0;background:var(--accent);color:#0b0d10;border-radius:12px;padding:14px;text-align:center;font-weight:900;font-size:15px}
.tabs{display:flex;gap:8px;padding:18px 22px 6px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{font-size:12px;padding:7px 14px;border-radius:999px;border:1px solid var(--line);color:var(--sub);white-space:nowrap;flex-shrink:0}
.tab.on{background:var(--text);color:#0b0d10;border-color:var(--text);font-weight:700}
.section{display:flex;align-items:baseline;justify-content:space-between;padding:20px 22px 10px}
.section h2{font-size:16px;font-weight:700}
.section span{font-size:10px;letter-spacing:.24em;color:var(--sub)}
.item{display:flex;gap:14px;padding:16px 22px;border-bottom:1px solid var(--line);position:relative;transition:opacity .25s,transform .25s}
.item.gone{opacity:0;transform:translateX(40px)}
.item.playing{background:#10151d}
.thumb{width:84px;height:84px;border-radius:14px;flex-shrink:0;display:flex;flex-direction:column;justify-content:space-between;padding:9px;overflow:hidden}
.thumb small{font-size:8px;letter-spacing:.2em;font-weight:700;opacity:.85}
.thumb strong{font-size:14px;font-weight:900;line-height:1.15;overflow-wrap:anywhere}
.thumb.mast{align-items:center;justify-content:center;writing-mode:vertical-rl;font-size:20px;font-weight:900;letter-spacing:.1em;border:1px solid #ffffff22}
.body{flex:1;min-width:0}
.meta{font-size:10.5px;color:var(--sub);letter-spacing:.06em}
.meta em{font-style:normal;color:var(--accent);font-weight:700;margin-right:6px}
.meta a{margin-left:6px;color:var(--sub)}
.title{font-size:14px;font-weight:700;line-height:1.45;margin-top:4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;text-align:left;width:100%}
.note{font-size:11px;color:var(--sub);margin-top:2px}
.row{display:flex;align-items:center;justify-content:space-between;margin-top:9px}
.pl{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--sub)}
.ic{width:28px;height:28px;border-radius:50%;border:1.5px solid var(--text);position:relative;flex-shrink:0}
.ic:after{content:"";position:absolute;left:10px;top:7.5px;border-left:9px solid var(--text);border-top:6px solid transparent;border-bottom:6px solid transparent}
.playing .ic{background:var(--accent);border-color:var(--accent)}
.playing .ic:after,.playing .ic:before{content:"";position:absolute;top:8px;width:3px;height:10px;background:#fff;border:0;border-radius:1px}
.playing .ic:before{left:9px}.playing .ic:after{left:14px}
.item.pz .ic{background:none;border-color:var(--text)}
.item.pz .ic:before{display:none}
.item.pz .ic:after{left:10px;top:7.5px;width:0;height:0;background:none;border-radius:0;border-left:9px solid var(--text);border-top:6px solid transparent;border-bottom:6px solid transparent}
.done{width:32px;height:32px;font-size:15px;font-weight:700;color:var(--accent);border:1.5px solid var(--accent);border-radius:50%;display:flex;align-items:center;justify-content:center}
.done:active{background:var(--accent);color:#fff}
.new{position:absolute;left:12px;top:12px;width:8px;height:8px;border-radius:50%;background:var(--accent)}
.empty{padding:60px 22px;text-align:center;color:var(--sub);font-size:13px;line-height:1.8}
.player{position:fixed;left:0;right:0;bottom:0;background:#15191f;border-top:1px solid var(--line);padding:12px 18px calc(12px + env(safe-area-inset-bottom));display:flex;align-items:center;gap:12px;transition:transform .25s}
.player.hide{transform:translateY(110%)}
.bar{position:absolute;left:0;right:0;top:-1px;height:3px;background:var(--line)}
.bar i{position:absolute;left:0;top:0;height:3px;width:0;background:var(--pc,var(--accent))}
.mini{width:42px;height:42px;border-radius:9px;background:var(--line);flex-shrink:0;display:flex;align-items:center;justify-content:center;writing-mode:vertical-rl;font-size:12px;font-weight:900}
.info{flex:1;min-width:0}
.info b{font-size:12.5px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.info span{font-size:10px;color:var(--sub);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.big{width:44px;height:44px;border-radius:50%;background:var(--pc,var(--accent));position:relative;flex-shrink:0}
.big:after{content:"";position:absolute;left:17px;top:13px;border-left:13px solid #fff;border-top:9px solid transparent;border-bottom:9px solid transparent}
.big.on:after,.big.on:before{content:"";position:absolute;top:14px;width:4px;height:16px;background:#fff;border:0;border-radius:2px}
.big.on:before{left:15px}.big.on:after{left:24px}
.x{width:36px;height:36px;border-radius:50%;border:1.5px solid var(--line);color:var(--sub);font-size:15px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.toast{position:fixed;left:16px;right:16px;bottom:calc(88px + env(safe-area-inset-bottom));background:#f2f3f5;color:#0b0d10;border-radius:12px;padding:12px 16px;font-size:13px;display:flex;justify-content:space-between;align-items:center;transform:translateY(20px);opacity:0;pointer-events:none;transition:.2s}
.toast.show{transform:none;opacity:1;pointer-events:auto}
.toast button{color:var(--accent);font-weight:700}
</style></head><body>
<header>
  <div class="eyebrow" id="eyebrow"></div>
  <h1 id="h1"></h1>
  <p class="lead" id="lead"></p>
</header>
<div class="sw" id="sw"></div>
<div id="top"></div>
<div id="list"></div>

<div class="player hide" id="player">
  <div class="bar"><i id="prog"></i></div>
  <div class="mini" id="pMini"></div>
  <div class="info"><b id="pTitle"></b><span id="pSub"></span></div>
  <button class="big" id="pBtn" aria-label="再生"></button>
  <button class="x" id="pClose" aria-label="再生を終了">✕</button>
</div>
<div class="toast" id="toast"><span id="tMsg"></span><button id="tUndo">元に戻す</button></div>
<audio id="au" preload="none"></audio>

<script>
const REPO = "saelubebow-collab/Audio-News";
// 上の切り替えボタン（増やすときはここに足す）
const VIEWS = [
  { id: "audio", label: "音声解説", src: "episodes.json", color: "#3b8cff", eyebrow: "MORNING AUDIO BRIEF", h1: "今日の<br>音声解説", remote: true },
  { id: "paper", label: "全国紙", src: "news.json", group: "paper", color: "#f5a524", eyebrow: "MORNING PAPER BRIEF", h1: "今朝の<br>全国紙", unit: "紙" },
];
const PAL = [["#1d4fd8","#3b8cff"],["#0f766e","#34d399"],["#7c2d92","#e879f9"],["#b45309","#fbbf24"],["#be123c","#fb7185"],["#334155","#94a3b8"]];
const MAST = {"読売新聞":"#1c2a44","朝日新聞":"#3a1d1d","毎日新聞":"#1d3326","産経新聞":"#2e2640"};
const $ = id => document.getElementById(id);
const au = $("au");
const data = {};
let view = load("view", "audio"), tab = "すべて", cur = null, curView = null, pending = null;

function load(k, d){ try { const v = JSON.parse(localStorage.getItem(k)); return v == null ? d : v; } catch(e){ return d; } }
function store(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }
const hidden = new Set(load("hidden", []));
const durs = load("durs", {});

const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const sid = x => x.file.split("/").pop().replace(/\.[^.]+$/, "");
const host = x => { try { return new URL(x.link).hostname.replace(/^www\./, ""); } catch(e){ return ""; } };
function site(x){ if (x.site) return x.site; const m = x.title.match(/\s[-–|｜]\s([^-–|｜]+)$/); return m ? m[1].trim() : (host(x) || "その他"); }
const clean = t => t.replace(/\s[-–|｜]\s[^-–|｜]+$/, "").trim();
const FIX = {"民放online":0};
function colors(name){ if (name in FIX) return PAL[FIX[name]]; let h = 0; for (const c of name) h = (h * 31 + c.charCodeAt(0)) >>> 0; return PAL[h % PAL.length]; }
const grad = n => MAST[n] || (c => `linear-gradient(140deg,${c[0]},${c[1]})`)(colors(n));
const short = n => n.replace(/新聞$/, "").slice(0, 2);
const mmss = s => isFinite(s) && s > 0 ? Math.floor(s/60) + ":" + String(Math.floor(s%60)).padStart(2,"0") : "約5分";
const md = d => { const p = d.split("-"); return p.length === 3 ? (+p[1]) + "/" + (+p[2]) : d; };
function todayStr(){ const d = new Date(); return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0"); }
const V = id => VIEWS.find(v => v.id === id) || VIEWS[0];
const items = id => { const v = V(id); return (data[id] || []).filter(x => !hidden.has(sid(x)) && (!v.group || x.group === v.group)); };
const today = d => { const n = new Date(); return `${n.getMonth()+1}月${n.getDate()}日（${"日月火水木金土"[n.getDay()]}）`; };

function render(){
  const v = V(view), all = items(view), t = todayStr();
  document.documentElement.style.setProperty("--accent", v.color);
  $("eyebrow").textContent = v.eyebrow; $("h1").innerHTML = v.h1;
  $("sw").innerHTML = VIEWS.map(w => `<button data-view="${w.id}" class="${w.id===view?"on":""}">${w.label}${w.id!==view && items(w.id).some(x => x.date === t) ? "<i></i>" : ""}</button>`).join("");
  const mins = Math.round(all.reduce((a, x) => a + (durs[sid(x)] || 300), 0) / 60);
  let list = all;
  if (v.remote){
    $("lead").textContent = today() + " ・ 通勤時間にちょうどいい5分ずつ";
    const sites = ["すべて", ...new Set(all.map(site))];
    if (!sites.includes(tab)) tab = "すべて";
    if (tab !== "すべて") list = all.filter(x => site(x) === tab);
    $("top").innerHTML = `<div class="count"><div>NEW<b>${all.filter(x => x.date === t).length}</b></div><div>TOTAL<b>${all.length}</b></div><div>TIME<b>約${mins}分</b></div></div>
      <div class="tabs">${sites.map(s => `<button class="tab${s===tab?" on":""}" data-tab="${esc(s)}">${esc(s)}</button>`).join("")}</div>
      <div class="section"><h2>未聴の解説</h2><span>LATEST</span></div>`;
  } else {
    $("lead").textContent = today() + (all.length ? ` ・ ${all.length}${v.unit} ・ 各5分で約${mins}分` : "");
    $("top").innerHTML = (all.length ? `<button class="all" data-all="1">▶ ${all.length}${v.unit}を続けて聞く</button>` : "")
      + `<div class="section"><h2>今朝の${v.label}</h2><span>TODAY</span></div>`;
  }
  if (!list.length){
    $("list").innerHTML = data[view] === undefined ? `<div class="empty">読み込み中…</div>`
      : `<div class="empty">${v.remote ? "未聴の解説はありません。<br>新しい記事が出たら、毎朝ここに届きます。" : "まだ今朝のまとめはありません。<br>毎朝5時半ごろに届きます。"}</div>`;
  } else {
    $("list").innerHTML = list.map(x => {
      const s = sid(x), n = site(x);
      const thumb = v.remote
        ? `<div class="thumb" style="background:${grad(n)}"><small>${esc(host(x).split(".")[0].toUpperCase())}</small><strong>${esc(n)}</strong></div>`
        : `<div class="thumb mast" style="background:${grad(n)}">${esc(short(n))}</div>`;
      const sub = v.remote ? "" : `<div class="note">${x.count ? `主なニュース ${x.count}本から` : ""}</div>`;
      return `<div class="item${s===cur?" playing":""}" data-sid="${s}">
        ${x.date === t ? '<span class="new"></span>' : ""}${thumb}
        <div class="body">
          <div class="meta"><em>${esc(n)}</em>${esc(md(x.date))}<a href="${esc(x.link)}" target="_blank" rel="noopener">${v.remote ? "記事" : "サイト"} ↗</a></div>
          <button class="title" data-play="${s}">${esc(clean(x.title))}</button>${sub}
          <div class="row">
            <button class="pl" data-play="${s}"><span class="ic"></span><span>${mmss(durs[s])}</span></button>
            <button class="done" data-done="${s}" aria-label="聞いた">✓</button>
          </div>
        </div></div>`;
    }).join("");
  }
  syncPlayer();
}

function find(s){ for (const w of VIEWS){ const x = (data[w.id] || []).find(x => sid(x) === s); if (x) return [x, w.id]; } return [null, null]; }
function play(s){
  const [x, w] = find(s); if (!x) return;
  if (cur === s){ au.paused ? au.play() : au.pause(); return; }
  cur = s; curView = w; au.src = x.file; au.play().catch(()=>{});
  const n = site(x), v = V(w);
  $("pTitle").textContent = v.remote ? clean(x.title) : `${n}　${clean(x.title)}`;
  $("pMini").style.background = grad(n); $("pMini").textContent = v.remote ? "" : short(n);
  $("player").style.setProperty("--pc", v.color);
  $("player").classList.remove("hide");
  render();
}
function queue(){ const all = items(curView); const i = all.findIndex(x => sid(x) === cur); return i >= 0 && i + 1 < all.length ? all[i + 1] : null; }
function next(){ const n = queue(); if (n) play(sid(n)); else close(); }
function close(){
  au.pause(); au.removeAttribute("src"); au.load();
  cur = null; curView = null; $("player").classList.add("hide"); $("prog").style.width = "0"; render();
}
$("pClose").onclick = close;
function syncPlayer(){
  $("pBtn").classList.toggle("on", !au.paused);
  const it = cur && document.querySelector(`.item[data-sid="${cur}"]`);
  if (it) it.classList.toggle("pz", au.paused);
  const [x] = cur ? find(cur) : [null];
  if (x){
    const n = queue();
    $("pSub").textContent = site(x) + " ・ " + mmss(au.currentTime).replace("約5分","0:00") + " / " + mmss(au.duration) + (n && !V(curView).remote ? " ・ 次は" + site(n) : "");
  }
  $("prog").style.width = au.duration ? (au.currentTime / au.duration * 100) + "%" : "0";
}
au.addEventListener("timeupdate", syncPlayer);
au.addEventListener("play", syncPlayer);
au.addEventListener("pause", syncPlayer);
au.addEventListener("loadedmetadata", () => { if (cur && isFinite(au.duration)) { durs[cur] = au.duration; store("durs", durs); } });
au.addEventListener("ended", next);
$("pBtn").onclick = () => { if (cur) play(cur); };

function token(){
  let t = load("gh_token", "");
  if (!t){ t = (prompt("最初の1回だけ、GitHubの合言葉（github_pat_ で始まる文字列）を貼り付けてください") || "").trim(); if (t) store("gh_token", t); }
  return t;
}
function toast(msg, undo){
  $("tMsg").textContent = msg; $("tUndo").style.display = undo ? "" : "none";
  $("toast").classList.add("show"); clearTimeout(toast.t);
  toast.t = setTimeout(() => $("toast").classList.remove("show"), 3500);
}
async function send(s){
  const t = load("gh_token", "");
  try {
    const r = await fetch(`https://api.github.com/repos/${REPO}/contents/listened/${s}`, {
      method: "PUT",
      headers: { Authorization: "Bearer " + t, Accept: "application/vnd.github+json" },
      body: JSON.stringify({ message: "listened " + s, content: btoa("1") })
    });
    if (r.ok || r.status === 422) return;
    if (r.status === 401) store("gh_token", "");
    throw new Error(r.status);
  } catch(e){
    hidden.delete(s); store("hidden", [...hidden]); render();
    toast("うまく消せませんでした。もう一度押してください", false);
  }
}
function flush(){ if (pending){ clearTimeout(pending.t); if (pending.remote) send(pending.s); pending = null; } }
function done(s){
  const [, w] = find(s); const remote = V(w).remote;
  if (remote && !token()) return;
  flush();
  if (cur === s) close();
  const el = document.querySelector(`.item[data-sid="${s}"]`);
  if (el) el.classList.add("gone");
  setTimeout(() => { hidden.add(s); store("hidden", [...hidden]); render(); }, 250);
  pending = { s, remote, t: setTimeout(flush, 3500) };
  toast("聞いたものから外しました", true);
}
$("tUndo").onclick = () => {
  if (!pending) return;
  clearTimeout(pending.t); hidden.delete(pending.s); store("hidden", [...hidden]);
  pending = null; $("toast").classList.remove("show"); render();
};
document.addEventListener("visibilitychange", () => { if (document.hidden) flush(); });

document.addEventListener("click", e => {
  const b = e.target.closest("[data-view],[data-tab],[data-play],[data-done],[data-all]"); if (!b) return;
  if (b.dataset.view){ view = b.dataset.view; store("view", view); window.scrollTo(0, 0); render(); }
  else if (b.dataset.tab){ tab = b.dataset.tab; render(); }
  else if (b.dataset.all){ const f = items(view)[0]; if (f) play(sid(f)); }
  else if (b.dataset.play) play(b.dataset.play);
  else if (b.dataset.done) done(b.dataset.done);
});

if (!VIEWS.some(v => v.id === view)) view = "audio";
render();
const srcs = [...new Set(VIEWS.map(v => v.src))];
let ok = true;
Promise.all(srcs.map(src => fetch(src + "?" + Date.now()).then(r => r.ok ? r.json() : []).catch(() => { ok = false; return []; })
  .then(j => { for (const v of VIEWS) if (v.src === src) data[v.id] = Array.isArray(j) ? j : []; })))
  .then(() => {
    if (!ok) return render();
    const ids = new Set(Object.values(data).flat().map(sid));
    for (const h of [...hidden]) if (!ids.has(h)) hidden.delete(h);
    store("hidden", [...hidden]);
    render();
  });
</script>
</body></html>
